server:
  port: ${SERVER_PORT:8080}
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health
chat:
  max-messages-per-room: ${CHAT_MAX_MESSAGES_PER_ROOM:1000}
